[project]
name = "ai-agents-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "devrahulbanjara", email = "rdbanjara07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.3.1",
    "langfuse>=5.2.0",
    "loguru>=0.7.3",
    "openai>=3.37.0,<4",
    "openai-agents>=0.24.0",
    "openinference-instrumentation-openai-agents>=2.7.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agents-eval = "ai_agents_eval:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
